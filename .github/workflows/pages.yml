name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # GitHub Pages 让浏览器把每个文件各缓存 10 分钟；给 JS / CSS 加上本次提交号，
      # 新的 index.html 一定配新的脚本，不会新旧文件混着用
      - name: Stamp asset URLs with the commit
        run: |
          sed -i -E "s#(src|href)=\"([^\":]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" index.html
          grep -oE '(src|href)="[^"]+\?v=[0-9a-f]+"' index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
